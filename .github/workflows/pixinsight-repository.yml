name: Publish PixInsight Repository

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example 1.0.0"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: pixinsight-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish repository files
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build PixInsight update repository
        run: tools/build-pixinsight-repository.sh "${RELEASE_TAG}" repository

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PAGES_DIR="$(mktemp -d)"
          git init "${PAGES_DIR}"
          cd "${PAGES_DIR}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages:gh-pages
            git checkout gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout --orphan gh-pages
          fi

          cp -R "${GITHUB_WORKSPACE}/repository/." .
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to publish."
            exit 0
          fi

          git commit -m "Deploy PixInsight repository for ${RELEASE_TAG}"
          git push origin HEAD:gh-pages
